# Config for tinystories

# --- WandB ---
wandb_project: spd-lm
# wandb_project: null # Project name for Weights & Biases
wandb_run_name: null # Set specific run name (optional, otherwise generated)
wandb_run_name_prefix: "" # Prefix for generated run name

# --- General ---
seed: 0
unit_norm_matrices: false # Whether to enforce unit norm on A matrices (not typically used here)
m: 100 # Rank of the decomposition / number of components per layer
n_random_masks: 1 # Number of random masks if random_mask_recon_coeff is used
n_gate_hidden_neurons: null
init_from_target_model: false # Not implemented/applicable for this setup
target_module_patterns: ["transformer.h.3.mlp.c_fc"]

# --- Loss Coefficients ---
param_match_coeff: 1.0
masked_recon_coeff: null
random_mask_recon_coeff: null
layerwise_recon_coeff: null
layerwise_random_recon_coeff: 1
lp_sparsity_coeff: 1e-6
schatten_coeff: null
# embedding_recon_coeff: 1
embedding_recon_coeff: null
is_embed_unembed_recon: false
pnorm: 2.0

# --- Training ---
batch_size: 4 # Adjust based on GPU memory
steps: 50_000 # Total training steps
lr: 1e-4 # Learning rate
lr_schedule: constant # LR schedule type (constant, linear, cosine, exponential)
lr_warmup_pct: 0.01 # Percentage of steps for linear LR warmup
lr_exponential_halflife: null # Required if lr_schedule is exponential
n_eval_steps: 100 # Number of evaluation steps

# --- Logging & Saving ---
image_freq: 2000 # Frequency for generating/logging plots
image_on_first_step: true # Whether to log plots at step 0
print_freq: 1000 # Frequency for printing logs to console
save_freq: null # Frequency for saving checkpoints
log_ce_losses: true

# --- Pretrained model info ---
pretrained_model_class: transformers.AutoModelForCausalLM
pretrained_model_name: roneneldan/TinyStories-1M
pretrained_model_output_attr: logits
tokenizer_name: EleutherAI/gpt-neo-125M

# --- Task Specific ---
task_config:
  task_name: lm # Specifies the LM decomposition task
  max_seq_len: 2048 # Maximum sequence length for truncation/padding
  buffer_size: 1000 # Buffer size for streaming dataset shuffling
  dataset_name: "roneneldan/TinyStories" # HuggingFace dataset name
  column_name: "text" # Column name in dataset to use for LM task
  train_data_split: "train" # Dataset split to use
  eval_data_split: "validation" # Dataset split to use

